<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCH Idea Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efe9;--dot:#c3d0c4;--ink:#17261f;--mute:#5f7367;--card:#fbfdfb;--vine:#3f7a58;--sel:#1b5e8a;--gold:#d99a00;--bar:#f7faf7;--bd:#b9c7bc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--dot:#22332a;--ink:#e4efe7;--mute:#8da396;--card:#1a2a22;--vine:#6fb88c;--sel:#6cb4e6;--gold:#f0b429;--bar:#16231c;--bd:#2f453a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a15;--dot:#22332a;--ink:#e4efe7;--mute:#8da396;--card:#1a2a22;--vine:#6fb88c;--sel:#6cb4e6;--gold:#f0b429;--bar:#16231c;--bd:#2f453a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--vine)}
button.pri{background:var(--vine);color:var(--bg);border-color:var(--vine);font-weight:600}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;box-sizing:border-box}
#menu{height:100%;overflow:auto;padding:32px 20px;max-width:560px;margin:0 auto}
#menu h1{font-size:2.2rem;margin:0 0 4px;letter-spacing:-.02em}
.mute{color:var(--mute)}
.row{display:flex;gap:8px;margin:8px 0}
.row input{flex:1;min-width:0}
.row .open{flex:1;text-align:left;font-weight:600}
#editor{height:100%;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
#crumbs{display:flex;gap:4px;align-items:center;flex:1;min-width:120px}
#crumbs button{border:0;background:none;padding:4px 6px;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis}
#crumbs button:last-child{color:var(--vine)}
#cv{flex:1;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:26px 26px;cursor:grab}
#world{position:absolute;left:0;top:0}
#ln{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.n{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--vine);border-radius:20px;padding:10px 18px 8px;min-width:96px;max-width:230px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.14);cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.n.sel{border-color:var(--sel);box-shadow:0 0 0 4px color-mix(in srgb,var(--sel) 25%,transparent)}
.n .t{display:block;font-weight:600;overflow-wrap:anywhere}
.n .t.ph{color:var(--mute);font-weight:400}
.n .op{display:inline-block;margin-top:4px;font-size:12px;color:var(--vine);padding:1px 8px;border-radius:10px;border:1px solid var(--bd);cursor:pointer}
.n .op:hover{background:var(--vine);color:var(--bg)}
.n .h{position:absolute;right:-11px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:50%;background:var(--vine);border:2px solid var(--card);cursor:crosshair}
.lk{fill:none;stroke:var(--vine);stroke-width:3;stroke-linecap:round}
.lk.note{stroke:var(--gold);stroke-width:4}
.lk.sel{stroke:var(--sel);stroke-width:5}
.hit{fill:none;stroke:transparent;stroke-width:20;cursor:pointer}
.dot{fill:var(--gold);stroke:var(--card);stroke-width:2}
.nt{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;text-anchor:middle}
.tmp{fill:none;stroke:var(--sel);stroke-width:3;stroke-dasharray:6 6}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--mute);text-align:center;padding:0 30px}
#insp{background:var(--bar);border-top:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:6px}
#insp textarea{width:100%;resize:vertical;min-height:46px}
#insp .bt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .card{background:var(--bar);border:1px solid var(--bd);border-radius:14px;padding:16px;width:min(560px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#modal h3{margin:0}
#modal textarea{width:100%;height:240px;font:13px/1.4 ui-monospace,monospace}
</style>
</head>
<body>
<div id="menu">
  <h1>RCH Idea Maps</h1>
  <p class="mute">Map ideas that hold ideas. Every bubble can open into its own map, and any map can be shared with Claude as plain text.</p>
  <div class="row"><input id="nm" placeholder="Name your new mindmap" maxlength="60"><button class="pri" id="mk">Start new</button></div>
  <h3>Your mindmaps</h3>
  <div id="list"></div>
  <div class="row"><button id="imp0">Open from pasted text or file</button></div>
</div>

<div id="editor" hidden>
  <div id="top">
    <button id="home">Maps</button>
    <div id="crumbs"></div>
    <button class="pri" id="addb">+ Bubble</button>
    <button id="shn">Show notes</button>
    <button id="exp">Share with Claude</button>
    <button id="imp">Import</button>
  </div>
  <div id="cv">
    <div id="world"><svg id="ln"></svg></div>
    <div id="empty" hidden>This map is empty. Double-click anywhere, or press + Bubble, to add your first idea.</div>
  </div>
  <div id="insp"></div>
</div>
<div id="modal" hidden></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8);
const NS='http://www.w3.org/2000/svg';
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function sv(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const idx=()=>{try{return JSON.parse(store.get('mm:index')||'[]')}catch(e){return[]}};
let doc=null,path=[],sel=null,pan={x:0,y:0},showNotes=false;
const empty=()=>({nodes:[],links:[]});

function cur(){let m=doc.root;for(const id of path){const n=m.nodes.find(n=>n.id===id);if(!n)break;m=n.map||(n.map=empty())}return m}
function save(){store.set('mm:'+doc.id,JSON.stringify(doc));const ix=idx().filter(i=>i.id!==doc.id);ix.unshift({id:doc.id,name:doc.name});store.set('mm:index',JSON.stringify(ix))}

/* ---------- menu ---------- */
function menu(){
  doc=null;path=[];sel=null;$('#editor').hidden=true;$('#menu').hidden=false;
  const L=$('#list');L.innerHTML='';const ix=idx();
  if(!ix.length)L.append(el('p','mute','Nothing saved yet. Start a new mindmap above.'));
  ix.forEach(i=>{const r=el('div','row'),o=el('button','open',i.name),x=el('button','',' Delete ');
    o.onclick=()=>openDoc(i.id);
    x.onclick=()=>{if(x.dataset.s){store.del('mm:'+i.id);store.set('mm:index',JSON.stringify(idx().filter(k=>k.id!==i.id)));menu()}else{x.dataset.s=1;x.textContent='Confirm delete'}};
    r.append(o,x);L.append(r)});
}
function openDoc(id){try{doc=JSON.parse(store.get('mm:'+id))}catch(e){doc=null}if(!doc){menu();return}path=[];sel=null;$('#menu').hidden=true;$('#editor').hidden=false;resetPan();render()}
function newDoc(){const name=$('#nm').value.trim()||'Untitled mindmap';doc={id:uid(),name,root:empty()};save();$('#nm').value='';openDoc(doc.id)}
$('#mk').onclick=newDoc;$('#nm').onkeydown=e=>{if(e.key==='Enter')newDoc()};
$('#home').onclick=menu;

/* ---------- canvas ---------- */
const cv=$('#cv'),world=$('#world'),ln=$('#ln');
function resetPan(){pan={x:cv.clientWidth/2,y:cv.clientHeight/2}}
function wp(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left-pan.x,y:e.clientY-r.top-pan.y}}
function place(){world.style.transform=`translate(${pan.x}px,${pan.y}px)`}

function render(){
  const m=cur();
  world.querySelectorAll('.n').forEach(e=>e.remove());
  m.nodes.forEach(n=>{
    const e=el('div','n');e.dataset.id=n.id;e.style.left=n.x+'px';e.style.top=n.y+'px';
    const t=el('span','t'+(n.text?'':' ph'),n.text||'New idea');
    const c=n.map?n.map.nodes.length:0;
    const op=el('span','op',c?`▸ ${c} inside`:'▸ open');op.title='Open the map inside this bubble';
    e.append(t,op,el('i','h'));e.firstChild.nextSibling;world.append(e);
  });
  place();lines();crumbs();$('#empty').hidden=m.nodes.length>0;
  document.querySelectorAll('.n').forEach(e=>e.classList.toggle('sel',!!sel&&sel.t==='n'&&sel.id===e.dataset.id));
  insp();
}
function crumbs(){
  const C=$('#crumbs');C.innerHTML='';let m=doc.root;
  const add=(txt,i)=>{if(i>0)C.append(el('span','mute','›'));const b=el('button','',txt||'Untitled');b.onclick=()=>{path=path.slice(0,i);sel=null;resetPan();render()};C.append(b)};
  add(doc.name,0);
  path.forEach((id,i)=>{const n=m.nodes.find(n=>n.id===id);add(n&&n.text||'New idea',i+1);m=n&&n.map||empty()});
}
function lines(){
  ln.innerHTML='';const m=cur();
  m.links.forEach(l=>{
    const a=m.nodes.find(n=>n.id===l.a),b=m.nodes.find(n=>n.id===l.b);if(!a||!b)return;
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,k=.12;
    const cx=(a.x+b.x)/2-dy*k,cy=(a.y+b.y)/2+dx*k;
    const d=`M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}`;
    const on=sel&&sel.t==='l'&&sel.id===l.id;
    ln.append(sv('path',{d,class:'lk'+(l.note?' note':'')+(on?' sel':'')}));
    const h=sv('path',{d,class:'hit','data-lid':l.id});
    if(l.note)h.append(sv('title',{},l.note));
    ln.append(h);
    if(l.note){
      const mx=.25*a.x+.5*cx+.25*b.x,my=.25*a.y+.5*cy+.25*b.y;
      ln.append(sv('circle',{cx:mx,cy:my,r:7,class:'dot','data-lid':l.id,style:'cursor:pointer'}));
      if(showNotes)ln.append(sv('text',{x:mx,y:my-14,class:'nt'},l.note.length>48?l.note.slice(0,46)+'…':l.note));
    }
  });
}
function select(t,id,focus){sel=t?{t,id}:null;document.querySelectorAll('.n').forEach(e=>e.classList.toggle('sel',!!sel&&sel.t==='n'&&sel.id===e.dataset.id));lines();insp(focus)}

function insp(focus){
  const I=$('#insp');I.innerHTML='';const m=cur();
  if(!sel){I.append(el('div','mute','Double-click empty space to add a bubble. Drag the dot on a bubble’s edge onto another bubble to link them. Double-click a bubble, or tap ▸, to go inside it.'));return}
  if(sel.t==='n'){
    const n=m.nodes.find(n=>n.id===sel.id);if(!n){sel=null;return insp()}
    const ta=el('textarea');ta.value=n.text;ta.placeholder='Type your idea';
    ta.oninput=()=>{n.text=ta.value;const e=document.querySelector(`.n[data-id="${n.id}"] .t`);if(e){e.textContent=n.text||'New idea';e.classList.toggle('ph',!n.text)}save();crumbs()};
    const bt=el('div','bt'),o=el('button','pri','Open inside ▸'),d=el('button','','Delete bubble');
    o.onclick=()=>enter(n.id);d.onclick=del;bt.append(o,d);I.append(el('b','','Bubble'),ta,bt);
    if(focus)setTimeout(()=>ta.focus(),0);
  }else{
    const l=m.links.find(l=>l.id===sel.id);if(!l){sel=null;return insp()}
    const nm=id=>(m.nodes.find(n=>n.id===id)||{}).text||'New idea';
    const ta=el('textarea');ta.value=l.note;ta.placeholder='Hidden note on this line. Claude can read it. A line with a note turns gold.';
    ta.oninput=()=>{l.note=ta.value.trim()?ta.value:'';save();lines()};
    const bt=el('div','bt'),d=el('button','','Delete line');d.onclick=del;bt.append(d);
    I.append(el('b','',`Line: ${nm(l.a)} → ${nm(l.b)}`),ta,bt);
    if(focus)setTimeout(()=>ta.focus(),0);
  }
}
function del(){
  const m=cur();if(!sel)return;
  if(sel.t==='n'){m.nodes=m.nodes.filter(n=>n.id!==sel.id);m.links=m.links.filter(l=>l.a!==sel.id&&l.b!==sel.id)}
  else m.links=m.links.filter(l=>l.id!==sel.id);
  sel=null;save();render();
}
addEventListener('keydown',e=>{
  if(!doc||$('#modal').hidden===false)return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(e.key==='Delete'||e.key==='Backspace'){del()}
});
function add(x,y){const m=cur(),n={id:uid(),x:Math.round(x),y:Math.round(y),text:'',map:null};m.nodes.push(n);save();render();select('n',n.id,true)}
function enter(id){const m=cur(),n=m.nodes.find(n=>n.id===id);if(!n)return;n.map=n.map||empty();path.push(id);sel=null;resetPan();render()}
$('#addb').onclick=()=>add(cv.clientWidth/2-pan.x+(Math.random()*120-60),cv.clientHeight/2-pan.y+(Math.random()*120-60));
$('#shn').onclick=e=>{showNotes=!showNotes;e.target.textContent=showNotes?'Hide notes':'Show notes';lines()};

/* ---------- pointer interaction ---------- */
function drag(ev,move,end){
  ev.preventDefault();
  const mv=e=>move(e),up=e=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(end)end(e)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
cv.addEventListener('pointerdown',ev=>{
  const t=ev.target,ne=t.closest&&t.closest('.n'),m=cur();
  if(ne){
    const id=ne.dataset.id,n=m.nodes.find(n=>n.id===id);
    if(t.classList.contains('op')){ev.preventDefault();enter(id);return}
    if(t.classList.contains('h')){
      select('n',id);const tmp=sv('path',{class:'tmp'});ln.append(tmp);
      drag(ev,e=>{const p=wp(e);tmp.setAttribute('d',`M${n.x} ${n.y}L${p.x} ${p.y}`)},e=>{
        tmp.remove();const u=document.elementFromPoint(e.clientX,e.clientY),b=u&&u.closest&&u.closest('.n');
        if(b&&b.dataset.id!==id&&!m.links.some(l=>(l.a===id&&l.b===b.dataset.id)||(l.a===b.dataset.id&&l.b===id))){
          const l={id:uid(),a:id,b:b.dataset.id,note:''};m.links.push(l);save();render();select('l',l.id,true)}});
      return;
    }
    select('n',id);const p0=wp(ev),ox=n.x-p0.x,oy=n.y-p0.y;let moved=false;
    drag(ev,e=>{const p=wp(e);n.x=Math.round(p.x+ox);n.y=Math.round(p.y+oy);moved=true;ne.style.left=n.x+'px';ne.style.top=n.y+'px';lines()},()=>{if(moved)save()});
    return;
  }
  const lk=t.closest&&t.closest('[data-lid]');
  if(lk){ev.preventDefault();select('l',lk.dataset.lid,true);return}
  select(null);const sx=ev.clientX-pan.x,sy=ev.clientY-pan.y;
  drag(ev,e=>{pan.x=e.clientX-sx;pan.y=e.clientY-sy;place()});
});
cv.addEventListener('dblclick',ev=>{
  const t=ev.target,ne=t.closest&&t.closest('.n');
  if(ne){if(!t.classList.contains('h')&&!t.classList.contains('op'))enter(ne.dataset.id);return}
  if(t.closest&&t.closest('[data-lid]'))return;
  const p=wp(ev);add(p.x,p.y);
});

/* ---------- export / import ---------- */
function toText(m,d){
  const pad='  '.repeat(d),nm=id=>(m.nodes.find(n=>n.id===id)||{}).text||'(empty)';let s='';
  m.nodes.forEach(n=>{
    s+=`${pad}- [${n.text||'(empty)'}]\n`;
    m.links.filter(l=>l.a===n.id).forEach(l=>{s+=`${pad}    links to [${nm(l.b)}]${l.note?` | hidden note on this link: “${l.note}”`:''}\n`});
    if(n.map&&n.map.nodes.length)s+=`${pad}    inside this bubble:\n`+toText(n.map,d+3);
  });
  return s;
}
function textExport(){
  return `MINDMAP: ${doc.name}\nHow to read: each "- [..]" is a bubble. "links to" lines are connections to other bubbles in the same map. A "hidden note" is text the author attached to a connection. "inside this bubble" is a nested mini mindmap held by that bubble.\n\n`+toText(doc.root,0);
}
function modal(title,build){
  const o=$('#modal');o.innerHTML='';const c=el('div','card');c.append(el('h3','',title));build(c);
  const b=el('button','','Close');b.onclick=()=>o.hidden=true;c.append(b);o.append(c);o.hidden=false;
}
function exportM(){
  if(!doc)return;
  modal('Share with Claude',c=>{
    const s=el('select');[['text','Text for Claude (paste into a chat)'],['json','JSON (to open again later)']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;s.append(o)});
    const ta=el('textarea');ta.readOnly=true;const fill=()=>{ta.value=s.value==='json'?JSON.stringify(doc,null,1):textExport()};fill();s.onchange=fill;
    const cp=el('button','pri','Copy to clipboard'),msg=el('span','mute','');
    cp.onclick=async()=>{ta.select();try{await navigator.clipboard.writeText(ta.value);msg.textContent='Copied.'}catch(e){try{document.execCommand('copy');msg.textContent='Copied.'}catch(e2){msg.textContent='Press Ctrl+C to copy the selected text.'}}};
    const dlb=el('button','','Download file');
    dlb.onclick=()=>{const j=s.value==='json',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'text/plain'}));a.download=(doc.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()||'map')+(j?'.json':'.txt');a.click();msg.textContent='Downloaded.'};
    const bt=el('div','bt');bt.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';bt.append(cp,dlb,msg);
    c.append(s,ta,bt,el('p','mute','Claude can’t see your browser’s saved maps. To share one, paste the text into a chat, or upload the file to your GitHub repo’s maps folder and give Claude the link.'));
  });
}
function importM(){
  modal('Open a mindmap',c=>{
    const ta=el('textarea');ta.placeholder='Paste exported JSON here, or choose a file below';
    const f=el('input');f.type='file';f.accept='.json,.txt,application/json,text/plain';
    f.onchange=()=>{const r=new FileReader();r.onload=()=>{ta.value=r.result};if(f.files[0])r.readAsText(f.files[0])};
    const msg=el('span','mute',''),go=el('button','pri','Open it');
    go.onclick=()=>{try{const o=JSON.parse(ta.value);if(!o||!o.root||!Array.isArray(o.root.nodes))throw 0;o.id=uid();o.name=o.name||'Imported mindmap';doc=o;save();$('#modal').hidden=true;openDoc(o.id)}catch(e){msg.textContent='That is not a Mindbloom JSON export. Use the JSON option when exporting.'}};
    const u=el('input');u.placeholder='…or paste a link to a JSON file (such as a raw GitHub link)';
    const gu=el('button','','Load from link');
    gu.onclick=async()=>{try{const r=await fetch(u.value.trim());if(!r.ok)throw 0;ta.value=await r.text();msg.textContent='Loaded. Press Open it.'}catch(e){msg.textContent='Could not load that link.'}};
    c.append(ta,f,u,gu,go,msg);
  });
}
$('#exp').onclick=exportM;$('#imp').onclick=importM;$('#imp0').onclick=importM;
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')e.target.hidden=true});
addEventListener('resize',()=>{if(doc)place()});
menu();
</script>
</body>
</html>
